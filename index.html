<!doctype html>
<html lang="zh-Hant">

<title>Defeating the KTM 5-Poison Threat</title>
<style>
html,body{margin:0;height:100%;background:#0b0b14;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#fff}
#wrap{display:flex;flex-direction:column;width:100%;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);box-sizing:border-box}
#screen{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 0 2px #23233a,0 10px 40px #000}
#hint{text-align:center;font-size:13px;color:#8a8ab0;padding:6px 8px 10px;letter-spacing:.5px}
#hint b{color:#ffd84a;font-weight:600}
#pad{display:none;justify-content:space-between;gap:14px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));box-sizing:border-box;width:100%;max-width:620px;margin:0 auto}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;max-width:250px}
.b{touch-action:none;border:0;border-radius:14px;font:700 17px/1 system-ui,sans-serif;color:#fff;min-height:60px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#41466a,#262a42);box-shadow:0 5px 0 #12141f,inset 0 1px 0 #ffffff30;-webkit-user-select:none;user-select:none;padding:0}
.b.on{transform:translateY(4px);box-shadow:0 1px 0 #12141f;filter:brightness(1.35)}
.b.wide{grid-column:span 2}
.b.grd{background:linear-gradient(#3b78d8,#1f4a94);box-shadow:0 5px 0 #0f2550}
.b.atk{background:linear-gradient(#e04848,#951f1f);box-shadow:0 5px 0 #4d0c0c}
.b.star{background:linear-gradient(#f7cb3c,#b9890f);color:#3b2a00;box-shadow:0 5px 0 #5a4300}
.ico{position:absolute;top:8px;width:40px;height:40px;border-radius:50%;border:0;background:#00000088;color:#fff;font:700 16px/40px system-ui;text-align:center;z-index:5;padding:0}
#bMute{right:8px}#bPause{left:8px;display:none}
.touch #pad{display:flex}
.touch #hint{display:none}
@media (orientation:landscape){
  .touch #wrap{flex-direction:row;align-items:center}
  .touch #pad{display:contents}
  .touch #gl{order:0;width:min(30vw,210px);margin:0 10px 0 14px;flex:none}
  .touch #screen{order:1;height:100%}
  .touch #gr{order:2;width:min(30vw,210px);margin:0 14px 0 10px;flex:none}
  .touch .b{min-height:min(19vh,72px)}
}

<div id="wrap">

const textW = (s, sc = 1) => String(s).length * 4 * sc - sc;
function _txt(s, x, y, c, sc) {
  ctx.fillStyle = c;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]]; if (!g) continue;
    for (let r = 0; r < 5; r++) { const row = g[r]; if (!row) continue;
      for (let b = 0; b < 3; b++) if (row & (4 >> b)) ctx.fillRect(x + i * 4 * sc + b * sc, y + r * sc, sc, sc); }
  }
}
function txt(s, x, y, c = '#fff', sc = 1, al = 'l', sh = null) {
  s = String(s).toUpperCase();

  x = Math.round(x); y = Math.round(y);

// ---------------------------------------------------------------- audio (Web Audio, all synthesized)

// ---------------------------------------------------------------- chiptune sequencer
function nn(s) {
  if (typeof s === 'number') return s;
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(s); if (!m) return null;
  return 12 * (+m[3] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const P = (...bars) => bars.join(' ').trim().split(/\s+/);
function bassLine(roots, style) {
  const out = [];
  for (const r of roots) { const m = nn(r);
    if (style === 'walk') out.push(m, '-', '-', '.', m + 7, '-', '.', '.', m + 12, '-', '.', '.', m + 7, '-', '.', '.');
    else if (style === 'pulse') out.push(m, '.', m, m, '.', m, m, '.', m, '.', m, m, '.', m + 12, m, '.');
    else out.push(m, '.', m, '.', m + 12, '.', m, '.', m, '.', m, '.', m + 12, '.', m + 7, '.');
  }
  return out;
}
const TRACKS = {

TRACKS.boss2 = Object.assign({}, TRACKS.boss, { bpm: 192 });
const Mus = { trk: null, name: null, step: 0, t: 0, out: null, pending: null };
function musicStop() {
  if (Mus.out && AC) { const o = Mus.out; o.gain.setTargetAtTime(0, AC.currentTime, 0.05); setTimeout(() => { try { o.disconnect(); } catch (e) {} }, 600); }
  Mus.out = null; Mus.trk = null; Mus.name = null;
}
function musicPlay(name) {
  if (!AC) { Mus.pending = name; return; }
  if (Mus.name === name) return;
  musicStop();
  Mus.name = name; Mus.trk = TRACKS[name]; Mus.step = 0; Mus.t = AC.currentTime + 0.06;
  Mus.out = AC.createGain(); Mus.out.gain.value = 1; Mus.out.connect(musicGain);
}
function voice(dest, f, t, d, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.setValueAtTime(vol * 0.8, t + Math.max(0.01, d - 0.03)); g.gain.linearRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.02);
}
function drum(dest, ch, t) {
  if (ch === 'k') { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.16); }
  else if (ch === 's' || ch === 'h' || ch === 'c') {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = NB;
    const d = ch === 's' ? 0.12 : ch === 'c' ? 0.5 : 0.03;
    f.type = ch === 's' ? 'bandpass' : 'highpass'; f.frequency.value = ch === 's' ? 1800 : 7000;
    g.gain.setValueAtTime(ch === 's' ? 0.45 : 0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02); }

function playSeq(dest, arr, step, t, sd, type, vol, oct = 0) {
  const n = arr.length, tok = arr[step % n];
  if (tok === '-' || tok === '.' || tok == null) return;
  const m = nn(tok); if (m == null) return;
  let k = 1; while (k < n && arr[(step + k) % n] === '-') k++;
  voice(dest, 440 * Math.pow(2, (m + oct - 69) / 12), t, k * sd * 0.92, type, vol);
}
setInterval(() => {
  if (!AC || !Mus.trk || G.paused) return;
  const tr = Mus.trk, sd = 60 / tr.bpm / 4;
  if (Mus.t < AC.currentTime - 0.2) Mus.t = AC.currentTime + 0.02;
  while (Mus.t < AC.currentTime + 0.15) {
    const s = Mus.step, o = Mus.out;
    playSeq(o, tr.lead, s, Mus.t, sd, 'square', 0.11);
    playSeq(o, tr.bass, s, Mus.t, sd, 'triangle', 0.3);
    drum(o, tr.drums[s % tr.drums.length], Mus.t);
    Mus.t += sd; Mus.step++;
    if (!tr.loop && Mus.step >= tr.lead.length) { Mus.trk = null; Mus.name = null; break; }
  }
}, 25);

    G.wipe -= dt; const k = clamp(G.wipe / 0.45, 0, 1);
    for (let y = 0; y < H; y += 8) { const h = Math.ceil(8 * k); R(0, y + (8 - h) / 2, W, h, '#000'); }
    for (let x = 0; x < W; x += 16) R(x, 0, Math.ceil(16 * k * k), H, '#000');
  }
  pressedSet.clear();
  requestAnimationFrame(frame);
}
go('title');
requestAnimationFrame(frame);
</script>
